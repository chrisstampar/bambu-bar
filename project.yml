# XcodeGen spec for Bambu Bar. scripts/generate.sh (run by build.sh and appstore.sh) generates
# BambuBar.xcodeproj from it; the project itself is not checked in.
#   Release   Developer ID build for GitHub (build.sh signs it by hand, outside Xcode)
#   AppStore  sandboxed Mac App Store build, signed automatically by Xcode: archive the
#             "BambuBar App Store" scheme (Product → Archive, or scripts/appstore.sh)
name: BambuBar
configs:
  Debug: debug
  Release: release
  AppStore: release
options:
  bundleIdPrefix: dev.rolottr
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  defaultConfig: Release
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: PCZ6F8Q9DZ
    APP_GROUP: "$(DEVELOPMENT_TEAM).dev.rolottr.BambuBar"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
  configs:
    AppStore:
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: Apple Development
      # macOS signs without profiles unless asked; TestFlight wants one in the app and in the widget.
      PROVISIONING_PROFILE_REQUIRED: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: APP_STORE
targets:
  BambuBar:
    type: application
    platform: macOS
    sources:
      - path: Sources/BambuBar
      - path: Sources/Shared
      - path: Resources/Certificates
        type: folder
        buildPhase: resources
      - path: Resources/hms_en.json
        buildPhase: resources
      - path: Resources/filaments.json
        buildPhase: resources
      - path: Resources/Printers
        buildPhase: resources
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rolottr.BambuBar
        PRODUCT_NAME: Bambu Bar
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Signing/BambuBar.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        AppStore:
          CODE_SIGN_ENTITLEMENTS: Resources/Signing/BambuBar-AppStore.entitlements
    dependencies:
      - target: BambuBarWidget
        embed: true
        codeSign: true
  BambuBarWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/BambuBarWidget
      - path: Sources/Shared
      - path: Resources/Printers
        buildPhase: resources
        excludes:
          - "*.usdz"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rolottr.BambuBar.Widget
        PRODUCT_NAME: BambuBarWidget
        INFOPLIST_FILE: Resources/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Signing/BambuBarWidget.entitlements
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
schemes:
  BambuBar:
    build:
      targets:
        BambuBar: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  BambuBar App Store:
    build:
      targets:
        BambuBar: all
    run:
      config: AppStore
    profile:
      config: AppStore
    analyze:
      config: AppStore
    archive:
      config: AppStore
